# Builds QComicBook.app for Apple silicon and packs it into a .dmg, which is
# available as a downloadable artifact of each run.
#
# Pushing a release tag (X.Y.Z, e.g. 0.10.0) on master also creates a draft
# GitHub Release with the .dmg attached, and the tag's ChangeLog entry as notes.
name: macOS app

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    # the oldest supported Apple silicon runner: Homebrew's libraries are
    # built for the runner's macOS, which becomes the app's minimum version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, to check that release tags are on master

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(sed -n 's/^SET(VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag doesn't match VERSION \"$version\" in CMakeLists.txt"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $tag is not on master"
            exit 1
          fi

      - name: Install dependencies
        run: brew install pkgconf qtbase qttools qttranslations poppler-qt6

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix poppler-qt6)/lib/pkgconfig"
          cmake -S . -B build
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 7-Zip's 7zz opens .cbr and .cb7 comics; tar, part of macOS, opens .cbt
          brew install sevenzip

          # small sample comics (4 public domain pages) from clach04/sample_reading_media
          samples="$RUNNER_TEMP/samples"
          gh release download v0.2 -R clach04/sample_reading_media -p sample_reading_media.zip -D "$samples"
          echo "7563d57566e6a851e10ce75823751289faad3e013ae124cc5957000731eda592  $samples/sample_reading_media.zip" | shasum -a 256 -c
          unzip -j -q "$samples/sample_reading_media.zip" '*bobby_make_believe_sample*.cb[r7t]' -d "$samples"

          # open each without a display: the app must keep running and
          # extract all the pages into its temporary folder
          for comic in "$samples"/*.cb[r7t]; do
            name=$(basename "$comic")
            tmp="$RUNNER_TEMP/tmp-$name"
            log="$RUNNER_TEMP/smoke.log"
            mkdir -p "$tmp"
            TMPDIR="$tmp" QT_QPA_PLATFORM=offscreen build/src/QComicBook.app/Contents/MacOS/QComicBook "$comic" > "$log" 2>&1 &
            pid=$!
            sleep 5
            if ! kill -0 "$pid" 2> /dev/null; then
              cat "$log"
              echo "::error::QComicBook exited early opening $name"
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
            pages=$(find "$tmp" -name '*.jpg' | wc -l)
            if [ "$pages" -ne 4 ]; then
              cat "$log"
              echo "::error::$name: extracted $pages pages, expected 4"
              exit 1
            fi
            echo "$name: ok"
          done

      - name: Package
        run: sh data/macos/make-dmg.sh build

      - uses: actions/upload-artifact@v7
        with:
          name: QComicBook-macOS-arm64
          path: build/QComicBook-*.dmg
          if-no-files-found: error

  release:
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: QComicBook-macOS-arm64

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # the tag's ChangeLog entry: from its "<date>:  <version>" line to the next empty line
          awk -v v="$tag" '$2 == v { p = 1 } p && /^[[:space:]]*$/ { exit } p' ChangeLog > entry.txt
          if [ -s entry.txt ]; then
            # code block, to keep the ChangeLog layout
            { echo '```'; cat entry.txt; echo '```'; } > notes.txt
          else
            echo "::warning::no ChangeLog entry for $tag"
            echo "QComicBook $tag" > notes.txt
          fi
          gh release create "$tag" QComicBook-*.dmg --draft --verify-tag \
            --title "QComicBook $tag" --notes-file notes.txt
